# 用途：从官方 appium/WebDriverAgent 源码构建 iOS 12 可用的 WDA（未签名 ipa）
# 放置位置：仓库根目录 .github/workflows/build-wda.yml（覆盖旧内容）
# 运行方式：Actions → Run workflow → 两个 job 并行跑 v10.5.4 / v9.15.3
#          下载“成功且未变红”那个 job 的 artifact（优先 v10.5.4）
name: Build WebDriverAgent (unsigned, iOS 12)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - wda_ref: v10.5.4
            artifact: WebDriverAgent-v10.5.4-ipa
          - wda_ref: v9.15.3
            artifact: WebDriverAgent-v9.15.3-ipa
    runs-on: macos-15
    name: Build ${{ matrix.wda_ref }}
    steps:
      - name: Xcode version
        run: xcodebuild -version

      - name: Checkout official WebDriverAgent source (${{ matrix.wda_ref }})
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: ${{ matrix.wda_ref }}

      - name: Diagnostics (before build)
        run: |
          echo "== HEAD =="
          git rev-parse HEAD
          echo "== deployment target occurrences in pbxproj =="
          grep -o "IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*" WebDriverAgent.xcodeproj/project.pbxproj | sort | uniq -c
          echo "== effective build settings =="
          xcodebuild -project WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner -showBuildSettings 2>/dev/null | grep -E "IPHONEOS_DEPLOYMENT_TARGET|MAXIMUM_VALID" || true

      - name: Build (unsigned, forced iOS 12.0 target, real device)
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify built MinimumOSVersion == 12.0 (hard check)
        run: |
          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          test -d "$APP" || { find build -maxdepth 5 -name '*.app'; exit 1; }
          MIN=$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")
          echo "built MinimumOSVersion = $MIN"
          [ "$MIN" = "12.0" ] || { echo "FAIL: expected 12.0, got $MIN"; exit 1; }

      - name: Package ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: WebDriverAgent.ipa
