# 用途：从官方 appium/WebDriverAgent 源码构建 iOS 12 可用的 WDA（未签名 ipa）
# 放置位置：仓库根目录 .github/workflows/build-wda.yml（覆盖旧内容）
# 关键点：必须用 Xcode 15.2（SDK 17.2，最后一代支持 iOS 12 部署的 SDK）。
#        Xcode 15.4+/16.x 的 XCTest 框架族硬引用 ___chkstk_darwin（iOS 13.4+ 才有），
#        在 iOS 12 上 dyld 加载即崩（已实测）。SDK 17.2 无此问题。
# 校验：1) 全部 Mach-O minos == 12；2) 内嵌框架无 ___chkstk_darwin 未定义引用；
#        3) Info.plist MinimumOSVersion == 12。任一不满足则 job 失败。
name: Build WebDriverAgent (unsigned, iOS 12, Xcode 15.2)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - wda_ref: v10.5.4
            artifact: WebDriverAgent-v10.5.4-xc152-ipa
          - wda_ref: v9.15.3
            artifact: WebDriverAgent-v9.15.3-xc152-ipa
    runs-on: macos-14
    name: Build ${{ matrix.wda_ref }} @ Xcode 15.2
    steps:
      - name: Select Xcode 15.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Show versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Checkout official WebDriverAgent source (${{ matrix.wda_ref }})
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: ${{ matrix.wda_ref }}

      - name: Build (unsigned, forced iOS 12.0 target, real device)
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Rewrite minos to 12.0 if needed and fix plists
        run: |
          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          test -d "$APP" || { echo "== app not found =="; find build -maxdepth 5 -name '*.app'; exit 1; }
          rm -rf "$APP/PlugIns/WebDriverAgentRunner.xctest.dSYM"
          FILES=$(find "$APP" -type f ! -path '*.dSYM*')
          for f in $FILES; do
            file "$f" | grep -q "Mach-O" || continue
            xcrun vtool -show-build "$f" 2>/dev/null | grep -q "platform IOS" || continue
            M=$(xcrun vtool -show-build "$f" | grep -m1 minos | awk '{print $2}')
            case "$M" in
              12.*) echo "minos ok: $f ($M)" ;;
              *)
                echo "patching minos $M -> 12.0: $f"
                xcrun vtool -set-build-version ios 12.0 17.2 -replace -output "$f.tmp" "$f"
                mv "$f.tmp" "$f"
                ;;
            esac
          done
          : > bad.txt
          for f in $FILES; do
            file "$f" | grep -q "Mach-O" || continue
            xcrun vtool -show-build "$f" 2>/dev/null | grep -q "platform IOS" || continue
            M=$(xcrun vtool -show-build "$f" | grep -m1 minos | awk '{print $2}')
            echo "$f -> minos $M"
            case "$M" in 12.*) ;; *) echo "$f" >> bad.txt ;; esac
          done
          if [ -s bad.txt ]; then echo "FAIL: minos not 12:"; cat bad.txt; exit 1; fi
          plutil -remove MinimumOSVersion "$APP/Info.plist" 2>/dev/null || true
          plutil -insert MinimumOSVersion -string "12.0" "$APP/Info.plist"
          XCT="$APP/PlugIns/WebDriverAgentRunner.xctest/Info.plist"
          if [ -f "$XCT" ]; then
            plutil -remove MinimumOSVersion "$XCT" 2>/dev/null || true
            plutil -insert MinimumOSVersion -string "12.0" "$XCT"
          fi

      - name: Symbol scan (undefined symbols absent on iOS 12)
        run: |
          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          : > badsym.txt
          for fw in "$APP"/Frameworks/* "$APP"/PlugIns/WebDriverAgentRunner.xctest/Frameworks/*; do
            [ -e "$fw" ] || continue
            if [ -d "$fw" ]; then BIN="$fw/$(basename "$fw" .framework)"; else BIN="$fw"; fi
            [ -f "$BIN" ] || continue
            file "$BIN" | grep -q "Mach-O" || continue
            if xcrun nm -u "$BIN" 2>/dev/null | grep -q "___chkstk_darwin"; then
              echo "$BIN references ___chkstk_darwin" >> badsym.txt
            fi
          done
          if [ -s badsym.txt ]; then
            echo "FAIL: iOS13.4+ only symbols found:"; cat badsym.txt; exit 1
          fi
          echo "symbol scan clean"

      - name: Package ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: WebDriverAgent.ipa

      - name: Upload diagnostics on failure
        if: failure()
        run: |
          mkdir -p diag
          APP=$(find build -maxdepth 5 -path '*Release-iphoneos*Runner.app' | head -1)
          if [ -n "$APP" ]; then
            cp "$APP/Info.plist" diag/app-Info.plist 2>/dev/null || true
            cat badsym.txt > diag/bad-symbols.txt 2>/dev/null || true
            cat bad.txt > diag/bad-minos.txt 2>/dev/null || true
          fi
          git rev-parse HEAD > diag/head.txt

      - name: Upload diagnostic artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.wda_ref }}
          path: diag/
