# 用途：从官方 appium/WebDriverAgent 源码构建 iOS 12 可用的 WDA（未签名 ipa）
# 放置位置：仓库根目录 .github/workflows/build-wda.yml（覆盖旧内容）
# 双路线并行：
#   A: macos-14 + Xcode 15.4 原生构建（首选；若 runner 已退役则此 job 红）
#   B: macos-15 + Xcode 16.4 构建 + vtool 改写二进制 minos 13.0→12.0（兜底）
# 判定：两路线都校验最终二进制 minos==12.0 并修正 Info.plist，绿了才出 artifact
name: Build WebDriverAgent (unsigned, iOS 12)

on:
  workflow_dispatch:

jobs:
  xcode15-native:
    name: A. macos-14 + Xcode 15.4 (native)
    runs-on: macos-14
    steps:
      - name: Xcode version
        run: xcodebuild -version

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout official WebDriverAgent source (v10.5.4)
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v10.5.4

      - name: Build (unsigned, forced iOS 12.0 target, real device)
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify and fix plist
        run: |
          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          test -d "$APP" || { echo "== app not found =="; find build -maxdepth 5 -name '*.app'; exit 1; }
          xcrun vtool -show-build "$APP/WebDriverAgentRunner-Runner"
          MINOS=$(xcrun vtool -show-build "$APP/WebDriverAgentRunner-Runner" | grep -m1 minos | awk '{print $2}')
          echo "binary minos = $MINOS"
          case "$MINOS" in
            12.*) ;;
            *) echo "FAIL: minos=$MINOS"; exit 1 ;;
          esac
          plutil -remove MinimumOSVersion "$APP/Info.plist" 2>/dev/null || true
          plutil -insert MinimumOSVersion -string "12.0" "$APP/Info.plist"

      - name: Package ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-v10.5.4-xcode15-ipa
          path: WebDriverAgent.ipa

  xcode16-patched:
    name: B. macos-15 + Xcode 16.4 + vtool patch
    runs-on: macos-15
    steps:
      - name: Xcode version
        run: xcodebuild -version

      - name: Checkout official WebDriverAgent source (v10.5.4)
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v10.5.4

      - name: Build (unsigned, forced iOS 12.0 target, real device)
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Rewrite binary minos 13.0 -> 12.0 (all Mach-O in bundle)
        run: |
          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          test -d "$APP" || { echo "== app not found =="; find build -maxdepth 5 -name '*.app'; exit 1; }
          find "$APP" -type f | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              if xcrun vtool -show-build "$f" 2>/dev/null | grep -q "platform IOS"; then
                echo "patching: $f"
                xcrun vtool -set-build-version ios 12.0 18.4 -replace -output "$f.tmp" "$f"
                mv "$f.tmp" "$f"
              fi
            fi
          done
          echo "== verify all patched =="
          BAD=0
          find "$APP" -type f | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              if xcrun vtool -show-build "$f" 2>/dev/null | grep -q "platform IOS"; then
                M=$(xcrun vtool -show-build "$f" | grep -m1 minos | awk '{print $2}')
                echo "$f -> minos $M"
                case "$M" in 12.*) ;; *) exit 1 ;; esac
              fi
            fi
          done || BAD=1
          [ "$BAD" = "0" ] || { echo "FAIL: some binaries still not minos 12"; exit 1; }

      - name: Fix plist MinimumOSVersion
        run: |
          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          plutil -remove MinimumOSVersion "$APP/Info.plist" 2>/dev/null || true
          plutil -insert MinimumOSVersion -string "12.0" "$APP/Info.plist"
          XCT="$APP/PlugIns/WebDriverAgentRunner.xctest/Info.plist"
          if [ -f "$XCT" ]; then
            plutil -remove MinimumOSVersion "$XCT" 2>/dev/null || true
            plutil -insert MinimumOSVersion -string "12.0" "$XCT"
          fi

      - name: Package ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-v10.5.4-patched-ipa
          path: WebDriverAgent.ipa
